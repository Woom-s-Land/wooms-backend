# .github/workflows/deploy.yml

name: Backend CI/CD to EC2

on:
  push:
    branches: [ 'develop#2' ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop#2
        uses: actions/checkout@v3
        with:
          ref: 'develop#2'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Set up JDK 22 on Runner
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '22'

      - name: Build with Gradle
        run: ./gradlew clean build --exclude-task test

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Sync artifacts to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "."
          target: "~/wooms-backend"

      - name: Build & Deploy on EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/wooms_backend
            
            # Docker 이미지 빌드 & 이전 컨테이너 내리기
            docker compose build --no-cache
            docker compose down
            
            cd ~/wooms_backend
            
            # env_file 생성 (echo 사용)
            echo "SPRING_DATASOURCE_URL=${{ secrets.SPRING_DATASOURCE_URL }}"     > env_file
            
            ls -al
            
            echo "SPRING_DATASOURCE_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME }}" >> env_file
            echo "SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }}" >> env_file
            echo "SPRING_JWT_SECRET=${{ secrets.SPRING_JWT_SECRET }}"               >> env_file
            echo "SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID=${{ secrets.SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID }}" >> env_file
            echo "SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET=${{ secrets.SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET }}" >> env_file
            echo "SPRING_DATA_REDIS_HOST=${{ secrets.SPRING_DATA_REDIS_HOST }}"     >> env_file
            echo "SPRING_DATA_REDIS_PORT=${{ secrets.SPRING_DATA_REDIS_PORT }}"     >> env_file
            echo "SPRING_DATA_REDIS_PASSWORD=${{ secrets.SPRING_DATA_REDIS_PASSWORD }}" >> env_file
            echo "SPRING_MAIL_USERNAME=${{ secrets.SPRING_MAIL_USERNAME }}"         >> env_file
            echo "SPRING_MAIL_PASSWORD=${{ secrets.SPRING_MAIL_PASSWORD }}"         >> env_file
            echo "CLOUD_AWS_S3_BUCKET=${{ secrets.CLOUD_AWS_S3_BUCKET }}"           >> env_file
            echo "CLOUD_AWS_CREDENTIALS_ACCESS_KEY=${{ secrets.CLOUD_AWS_CREDENTIALS_ACCESS_KEY }}" >> env_file
            echo "CLOUD_AWS_CREDENTIALS_SECRET_KEY=${{ secrets.CLOUD_AWS_CREDENTIALS_SECRET_KEY }}" >> env_file
            echo "SPRING_AI_OPENAI_API_KEY=${{ secrets.SPRING_AI_OPENAI_API_KEY }}" >> env_file
            echo "SPRING_FRONT_URI=${{ secrets.SPRING_FRONT_URI }}"                 >> env_file
            
            # 생성된 파일 확인 (디버그)
            ls -l env_file
            cat env_file
            
            # 컨테이너 재기동
            docker compose --env-file env_file up -d
            
            # 정리
            docker image prune -f
            rm env_file