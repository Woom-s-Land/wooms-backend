# ============================================================
# Local dev profile — boots without real secrets.
# OAuth login / S3 upload / OpenAI TTS / Mail send WILL NOT work
# with these dummy values. Replace if you need those features.
# ============================================================

# --- DataSource (H2 file-based: data survives restarts) ---
# DB file lives at ./data/devdb.mv.db (relative to the backend working dir).
# AUTO_SERVER lets the H2 console / other tools attach while the app runs.
spring.datasource.url=jdbc:h2:file:./data/devdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA ---
spring.jpa.open-in-view=false
# 'update' keeps the schema (and data) across restarts. Use create-drop only if you
# want a fresh DB every boot. To wipe the file DB, delete ./data/devdb.mv.db.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=false

# --- H2 console ---
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true

# --- Multipart upload ---
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# --- JWT ---
# HS256 requires >= 32 bytes. Local-only dummy secret.
spring.jwt.secret=local-dev-jwt-secret-please-change-me-32bytes-min!!
spring.jwt.access-token-validity-in-seconds=604800
spring.jwt.refresh-token-validity-in-seconds=1209600

# --- OAuth2 (Google) ---
# REQUIRED FOR BOOT: SecurityConfig calls .oauth2Login(), which needs a
# ClientRegistrationRepository bean. Spring only creates that bean when at
# least one registration has a client-id. So even in dev these must be set
# (dummy is fine — real Google login won't work, but the app boots).
spring.security.oauth2.client.registration.google.client-id=dummy-client-id
spring.security.oauth2.client.registration.google.client-secret=dummy-client-secret
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/api/login/oauth2/code/google

# --- Frontend callback URI (dev points at local Vite) ---
spring.front.uri=http://localhost:5173

# --- Redis (Lettuce connects lazily — OK if Redis isn't running) ---
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=

# --- Mail (host/port from prod, dummy creds) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=dev@example.com
spring.mail.password=dummy
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.starttls.enable=true

# --- AWS S3 (bucket URL from prod, dummy credentials) ---
cloud.aws.s3.bucket=dowooms
cloud.aws.s3.url=https://dowooms.s3.ap-northeast-2.amazonaws.com/
cloud.aws.credentials.access-key=dummy-access-key
cloud.aws.credentials.secret-key=dummy-secret-key
cloud.aws.region.static=ap-northeast-2
cloud.aws.region.auto=false
cloud.aws.stack.auto=false

# --- OpenAI ---
spring.ai.openai.api-key=sk-dummy-key-for-local-dev
spring.ai.openai.audio.speech.base-url=https://api.openai.com/v1/audio/speech

# --- Cookies (dev runs over HTTP, so secure=false + SameSite=Lax) ---
cookie.secure=false
cookie.samesite=Lax

# --- Logging ---
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
log.sample-rate=1
log.slow-ms=500

# --- Actuator / Prometheus ---
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.enabled=true
